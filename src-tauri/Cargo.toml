[package]
name = "sage-interface"
version = "0.1.0"
description = "Sage Interface — procedural visual front-end for coding agents"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sage_interface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macros and build scripts: never strip. Stripping these dylibs breaks
# dlopen on recent macOS ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
debug = false
